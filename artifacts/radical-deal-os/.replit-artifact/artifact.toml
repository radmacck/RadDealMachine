kind = "web"
previewPath = "/"
title = "Radical Deal OS"
description = "Internal wholesaling operating system: sourced property intelligence, deterministic underwriting, guided seller calls, verified buyers, matching and closing operations."
version = "1.0.0"
id = "artifacts/radical-deal-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20639

[services.development]
run = "pnpm --filter @workspace/radical-deal-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/radical-deal-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/radical-deal-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20639"
BASE_PATH = "/"
