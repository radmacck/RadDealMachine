        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 2, maxLength: 2 }
        county: { type: string, minLength: 1, maxLength: 100 }
        zip: { type: string, pattern: '^\d{5}(-\d{4})?$' }
        propertyType: { type: string, enum: [SINGLE_FAMILY, MULTIFAMILY, CONDO, TOWNHOUSE, LAND, OTHER] }
        sqft: { type: number, minimum: 0, maximum: 1000000 }
        beds: { type: integer, minimum: 0, maximum: 100 }
        baths: { type: number, minimum: 0, maximum: 100 }
        units: { type: integer, minimum: 1, maximum: 10000 }
        askingPrice: { type: ["number", "null"], minimum: 0, maximum: 1000000000 }
        sellerName: { type: string, minLength: 1, maxLength: 200 }
        sellerPhone: { type: string, maxLength: 50 }
        sellerEmail: { type: string, maxLength: 200 }
        sellerDescription: { type: string, maxLength: 5000 }
        sellingReason: { type: string, maxLength: 2000 }
        urgency: { type: string, enum: [UNKNOWN, LOW, MEDIUM, HIGH] }
        source: { type: string, minLength: 1, maxLength: 2000 }
        nextAction: { type: string, maxLength: 1000 }
