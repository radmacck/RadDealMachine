        leadId: { type: string, format: uuid }
        event: { type: string, enum: [QUEUE_SELECTED, CALL_SESSION_STARTED] }
        decision: { type: string, enum: [CALL_NEXT, BLOCKED] }
        recordedAt: { type: string, format: date-time }
        blocker: { type: ["string", "null"] }
        nextAction: { type: string }
    LeadDetail:
      type: object
      required: [lead, intelligence, analysis, analysisSnapshotId, underwriting, transitions, calls, offers, allowedTransitions, workGuidance]
      properties:
        lead: { $ref: "#/components/schemas/Lead" }
        intelligence: { type: array, items: { $ref: "#/components/schemas/Intelligence" } }
        analysis:
          oneOf: [{ $ref: "#/components/schemas/Analysis" }, { type: "null" }]
        analysisSnapshotId: { type: ["string", "null"] }
        offers: { type: array, items: { $ref: "#/components/schemas/Offer" } }
        underwriting:
          oneOf: [{ $ref: "#/components/schemas/UnderwritingInput" }, { type: "null" }]
        transitions: { type: array, items: { $ref: "#/components/schemas/Transition" } }
        calls: { type: array, items: { $ref: "#/components/schemas/Call" } }
        allowedTransitions: { type: array, items: { $ref: "#/components/schemas/DealStage" } }
        workGuidance:
          oneOf:
            - { $ref: "#/components/schemas/DealWorkGuidance" }
            - { type: "null" }
    CallBrief:
      type: object
      required: [lead, objective, intelligence, questions, actions, boundaries, analysis, authorizedOffer]
      properties:
        lead: { $ref: "#/components/schemas/Lead" }
        objective: { type: string }
        intelligence: { type: array, items: { $ref: "#/components/schemas/Intelligence" } }
        questions: { type: array, items: { type: string } }
        actions: { type: array, items: { type: string } }
        boundaries: { type: string }
        analysis: { $ref: "#/components/schemas/Analysis" }
        authorizedOffer:
          oneOf: [{ $ref: "#/components/schemas/Offer" }, { type: "null" }]
    OfferStatus:
      type: string
      enum: [DRAFT, AUTHORIZED, COMMUNICATED, REVOKED, INVALIDATED, EXPIRED]
    OfferTerms:
      type: object
      required: [amount, earnestMoney, closingDays, contingencies, assignmentIntent]
      properties:
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        earnestMoney: { type: number, minimum: 0, maximum: 1000000000 }
        closingDays: { type: integer, minimum: 1, maximum: 180 }
        contingencies: { type: string, minLength: 3, maxLength: 5000 }
        assignmentIntent: { type: boolean }
    OfferDraftInput:
      allOf:
        - { $ref: "#/components/schemas/OfferTerms" }
        - type: object
          required: [version, reason]
          properties:
            version: { type: integer, minimum: 1 }
            reason: { type: string, minLength: 3, maxLength: 2000 }
    OfferApprovalInput:
      type: object
      required: [version, maximumApprovedAcquisitionPrice, expiresAt, authorityEvidenceId, reason, nextAction, followUpAt]
      properties:
        version: { type: integer, minimum: 1 }
        maximumApprovedAcquisitionPrice: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        expiresAt: { type: string, format: date-time }
        authorityEvidenceId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        nextAction: { type: string, minLength: 3, maxLength: 1000 }
        followUpAt: { type: string, format: date-time }
    OfferCommunicationInput:
      type: object
      required: [version, amount, channel, evidence, nextAction, followUpAt]
      properties:
        version: { type: integer, minimum: 1 }
        amount: { type: number, exclusiveMinimum: 0, maximum: 1000000000 }
        channel: { type: string, enum: [PHONE, IN_PERSON, EMAIL, SMS] }
        evidence: { type: string, minLength: 3, maxLength: 5000 }
        nextAction: { type: string, minLength: 3, maxLength: 1000 }
        followUpAt: { type: string, format: date-time }
    OfferWithdrawalInput:
      type: object
      required: [version, reason, nextAction, followUpAt]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 2000 }
        nextAction: { type: string, minLength: 3, maxLength: 1000 }
        followUpAt: { type: string, format: date-time }
    Offer:
      allOf:
        - { $ref: "#/components/schemas/OfferTerms" }
        - type: object
          required: [id, leadId, analysisSnapshotId, status, effectiveStatus, blockers, reason, createdBy, createdAt, updatedAt, maximumApprovedAcquisitionPrice, authorityEvidenceId, approvedBy, approvedAt, approvalReason, expiresAt, communicatedBy, communicatedAt, communicatedAmount, channel, evidence, withdrawalReason]
          properties:
            id: { type: string, format: uuid }
            leadId: { type: string, format: uuid }
            analysisSnapshotId: { type: string, format: uuid }
            status: { $ref: "#/components/schemas/OfferStatus" }
            effectiveStatus: { $ref: "#/components/schemas/OfferStatus" }
            blockers: { type: array, items: { type: string } }
            reason: { type: string }
            createdBy: { type: string }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
            maximumApprovedAcquisitionPrice: { type: ["number", "null"] }
            authorityEvidenceId: { type: ["string", "null"] }
            approvedBy: { type: ["string", "null"] }
            approvedAt: { type: ["string", "null"] }
            approvalReason: { type: ["string", "null"] }
            expiresAt: { type: ["string", "null"] }
            communicatedBy: { type: ["string", "null"] }
            communicatedAt: { type: ["string", "null"] }
            communicatedAmount: { type: ["number", "null"] }
            channel: { type: ["string", "null"] }
            evidence: { type: ["string", "null"] }
            withdrawalReason: { type: ["string", "null"] }
    Dashboard:
      type: object
      required: [total, callReady, needsResearch, overdue, strong, negotiable, pass, stages, recentActivity]
      properties:
        total: { type: integer }
        callReady: { type: integer }
        needsResearch: { type: integer }
        overdue: { type: integer }
        strong: { type: integer }
        negotiable: { type: integer }
        pass: { type: integer }
        stages: { type: array, items: { $ref: "#/components/schemas/StageCount" } }
        recentActivity: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
    StageCount:
      type: object
      required: [stage, count]
      properties: { stage: { type: string }, count: { type: integer } }
    AuditEvent:
      type: object
      required: [id, actor, action, entityId, detail, createdAt]
      properties:
        id: { type: string }
        actor: { type: string }
        action: { type: string }
        entityId: { type: string }
        detail: { type: string }
        createdAt: { type: string }