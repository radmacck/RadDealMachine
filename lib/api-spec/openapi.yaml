openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: Radical Deal OS seller intake, underwriting, conversations and approved offers
servers:
  - url: /api
paths:
  /leads/{id}/contact-paths:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSellerContactPaths
      responses:
        "200":
          description: Ranked source-backed seller contact observations and explicit readiness blockers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerContactReadiness" }
    post:
      operationId: recordSellerContactObservation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerContactObservationInput" }
      responses:
        "200":
          description: Persisted contact observation and updated route readiness; no message or call is sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerContactReadiness" }
  /leads/{id}/contact-enrichment:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSellerContactEnrichment
      responses:
        "200":
          description: Provider capability states and persisted seller-contact enrichment request history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerContactEnrichmentStatus" }
    post:
      operationId: requestSellerContactEnrichment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerContactEnrichmentRequestInput" }
      responses:
        "200":
          description: Persisted idempotent lookup request; unavailable providers are reported without claiming a lookup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerContactEnrichmentStatus" }
  /deals/{id}/contract/exception:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordTransactionException
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionExceptionInput" }
      responses:
        "200":
          description: Evidenced owner-reviewed amendment, buyer release or restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /leads/{id}/evidence-intake:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: intakePropertyEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyEvidencePacket" }
      responses:
        "200":
          description: Atomic sourced property intake and deterministic evidence-reviewed underwriting
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /access:
    get:
      operationId: getAccess
      responses:
        "200":
          description: Membership and bootstrap state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
    post:
      operationId: claimWorkspace
      responses:
        "200":
          description: Claim an unowned workspace, once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Access" }
  /members:
    get:
      operationId: listMembers
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Member" } }
  /members/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateMember
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
  /dashboard:
    get:
      operationId: getDashboard
      responses:
        "200":
          description: Real pipeline summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /leads:
    get:
      operationId: listLeads
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Lead" } }
    post:
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /leads/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getLead
      responses:
        "200":
          description: Lead detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
    patch:
      operationId: updateLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadUpdate" }
      responses:
        "200":
          description: Updated and previous underwriting invalidated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /leads/{id}/intelligence:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: addIntelligence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntelligenceInput" }
      responses:
        "201":
          description: Immutable sourced statement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intelligence" }
  /leads/{id}/underwriting:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveUnderwriting
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnderwritingInput" }
      responses:
        "200":
          description: Deterministic analysis and saved input snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /leads/{id}/transition:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: transitionLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransitionInput" }
      responses:
        "200":
          description: Guarded and audited state transition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /leads/{id}/calls:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordCall
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallInput" }
      responses:
        "201":
          description: Call notes and follow-up saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /leads/{id}/offers:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createOfferDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferDraftInput" }
      responses:
        "201":
          description: Immutable proposal draft, not authorized or sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /leads/{id}/offers/{offerId}/authorize:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: authorizeOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferApprovalInput" }
      responses:
        "200":
          description: Owner-authorized proposal bound to a current underwriting snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /leads/{id}/offers/{offerId}/communicate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: communicateOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferCommunicationInput" }
      responses:
        "200":
          description: Records human communication of the approved proposal; does not send a message or execute a contract
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /leads/{id}/offers/{offerId}/withdraw:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: withdrawOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfferWithdrawalInput" }
      responses:
        "200":
          description: Cancels a draft or revokes internal approval; historical seller communication remains on record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /leads/{id}/offers/{offerId}/seller-portal:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getSellerOfferPortalControl
      responses:
        "200":
          description: Current seller offer link and append-only seller response history; no capability secret is returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerOfferPortalControl" }
    post:
      operationId: issueSellerOfferPortal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerOfferPortalIssueInput" }
      responses:
        "201":
          description: Owner-issued one-time capability link for the exact communicated offer; earlier links are revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerOfferPortalIssueResponse" }
  /call-next:
    get:
      operationId: getCallQueue
      responses:
        "200":
          description: Prioritized due seller conversations with provenance and boundaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CallBrief" } }
  /acquisition-queue:
    get:
      operationId: getAcquisitionQueue
      responses:
        "200":
          description: Ranked acquisition decisions including callable and explicitly blocked qualified opportunities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionQueue" }
  /leads/{id}/acquisition-queue-selection:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordAcquisitionQueueSelection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueSelectionInput" }
      responses:
        "200":
          description: Re-evaluated queue selection, with an audit event and contact-block event when applicable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionQueueEventResponse" }
  /leads/{id}/call-start:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: startCallSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CallStartInput" }
      responses:
        "200":
          description: Records an operator call-work session only after revalidating the direct contact route and current underwriting; no call is placed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcquisitionQueueEventResponse" }
  /assumptions:
    get:
      operationId: getAssumptions
      responses:
        "200":
          description: Configurable assumptions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assumptions" }
    put:
      operationId: updateAssumptions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Assumptions" }
      responses:
        "200":
          description: Updated; existing snapshots remain reproducible
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Assumptions" }
  /audit:
    get:
      operationId: listAudit
      responses:
        "200":
          description: Latest audit events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
  /command-center:
    get:
      operationId: getCommandCenter
      responses:
        "200":
          description: Action-oriented workspace derived from real deals and current permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandCenter" }
  /outcome-learning:
    get:
      operationId: getOutcomeLearning
      responses:
        "200":
          description: Evidence-backed outcome counts, prediction deltas, and calibration readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutcomeLearningReport" }
  /leads/{id}/outcomes/actuals:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordOutcomeActuals
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeActualsInput" }
      responses:
        "201":
          description: Owner-reviewed actual outcome comparison appended to the learning ledger
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutcomeObservation" }
  /outcome-learning/recommendations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: reviewOutcomeCalibration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OutcomeCalibrationReviewInput" }
      responses:
        "200":
          description: Review recorded; no live rule or economics is deployed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutcomeCalibrationRecommendation" }
  /buyers:
    get:
      operationId: listBuyers
      responses:
        "200":
          description: Buyer criteria and current verification
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Buyer" } }
    post:
      operationId: createBuyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInput" }
      responses:
        "201":
          description: Buyer recorded without automatic verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyer-intakes:
    get:
      operationId: listBuyerIntakes
      responses:
        "200":
          description: Pending, buyer-submitted profiles for owner review; not approved buyers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BuyerIntakeRecord" } }
  /buyer-intakes/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideBuyerIntake
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerIntakeDecisionInput" }
      responses:
        "200":
          description: Intake declined or converted to an unverified prospect; never auto-approved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerIntakeDecision" }
  /portal/buyer-intake:
    post:
      operationId: submitPublicBuyerIntake
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PublicBuyerIntakeInput" }
      responses:
        "202":
          description: Buyer-submitted profile saved for owner review; no buyer record or approval created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerIntakeReceipt" }
  /buyers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBuyer
      responses:
        "200":
          description: Buyer profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
    patch:
      operationId: updateBuyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerUpdate" }
      responses:
        "200":
          description: Updated buyer; revised identity invalidates verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyers/{id}/verification:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: verifyBuyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerVerificationInput" }
      responses:
        "200":
          description: Owner-reviewed dated identity and funding evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyers/{id}/qualification-portal:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: createBuyerQualificationPortalInvite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerQualificationPortalInviteInput" }
      responses:
        "201":
          description: Owner-created expiring capability link; no message is sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerQualificationPortalInvite" }
  /deals/{id}/operations:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getDealOperations
      responses:
        "200":
          description: Contract, current matching explanations and operational jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/matches:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: refreshMatches
      responses:
        "200":
          description: Real buyer matching against persisted evidence and criteria
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/matches/{buyerId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: buyerId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: recordBuyerResponse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerResponseInput" }
      responses:
        "200":
          description: Evidence-backed interest or owner-reviewed commitment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/distribution:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDealDistribution
      responses:
        "200":
          description: Owner-authorized, immutable buyer packet and recipient activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealDistribution" }
  /deals/{id}/distribution/authorize:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: authorizeDealDistribution
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionAuthorizationInput" }
      responses:
        "201":
          description: Owner locks buyer economics to the executed contract and its underwriting snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealDistribution" }
  /distribution/{id}/recipients:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: shareDistributionRecipients
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DistributionShareInput" }
      responses:
        "200":
          description: Creates or rotates single-use-view capability links for qualified buyers; links are returned once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DistributionShareResponse" }
  /deals/{id}/distribution/release-acceptance:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: releaseDistributionAcceptance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseDistributionAcceptanceInput" }
      responses:
        "200":
          description: Owner releases a soft buyer acceptance without changing contract commitment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealDistribution" }
  /portal/deal:
    get:
      operationId: getBuyerPortalDeal
      parameters:
        - { name: X-Portal-Token, in: header, required: true, schema: { type: string, minLength: 40, maxLength: 50 } }
      responses:
        "200":
          description: Redacted capability-protected buyer deal packet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerPortalDeal" }
  /portal/deal/response:
    post:
      operationId: respondToBuyerPortalDeal
      parameters:
        - { name: X-Portal-Token, in: header, required: true, schema: { type: string, minLength: 40, maxLength: 50 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerPortalIntentInput" }
      responses:
        "200":
          description: Append-only buyer interest, soft acceptance, or decline; not a buyer commitment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerPortalDeal" }
  /portal/buyer-qualification:
    get:
      operationId: getBuyerQualificationPortal
      parameters:
        - { name: X-Qualification-Portal-Token, in: header, required: true, schema: { type: string, minLength: 40, maxLength: 50 } }
      responses:
        "200":
          description: Minimal prefilled buyer criteria for a private, expiring self-report link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerQualificationPortal" }
  /portal/buyer-qualification/response:
    post:
      operationId: respondToBuyerQualificationPortal
      parameters:
        - { name: X-Qualification-Portal-Token, in: header, required: true, schema: { type: string, minLength: 40, maxLength: 50 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerQualificationPortalResponseInput" }
      responses:
        "200":
          description: Self-reported buyer criteria retained as unverified evidence pending owner review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuyerQualificationPortalResponse" }
  /portal/seller-offer:
    get:
      operationId: getSellerOfferPortal
      parameters:
        - { name: X-Seller-Offer-Token, in: header, required: true, schema: { type: string, minLength: 40, maxLength: 50 } }
      responses:
        "200":
          description: Exact seller-facing offer snapshot with response eligibility and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerOfferPortal" }
  /portal/seller-offer/response:
    post:
      operationId: respondToSellerOfferPortal
      parameters:
        - { name: X-Seller-Offer-Token, in: header, required: true, schema: { type: string, minLength: 40, maxLength: 50 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SellerOfferPortalResponseInput" }
      responses:
        "200":
          description: Append-only seller acceptance, rejection or counter proposal; never executes a contract or authorizes counter terms
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SellerOfferPortal" }
  /deals/{id}/destinations/{buyerId}/activity:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: buyerId, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordDestinationActivity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestinationActivityInput" }
      responses:
        "200":
          description: Append-only destination submission, reply, terms review, or fee evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/contract:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractInput" }
      responses:
        "201":
          description: Contract terms copied from the exact approved communicated offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/contract/documents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: preparePurchaseReviewDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrepareTransactionDocumentInput" }
      responses:
        "200":
          description: Persist a fillable, versioned review copy from current communicated seller terms; this is not a legal agreement or signature
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/contract/documents/{documentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: transitionTransactionDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionDocumentLifecycleInput" }
      responses:
        "200":
          description: Owner/reviewer rejection, void, or verified-expiry event; no send or signature is inferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/contract/documents/{documentId}/file:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadPurchaseReviewDocument
      responses:
        "200":
          description: Download a persisted review PDF only while its terms snapshot is still current
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "409":
          description: Document snapshot is stale; prepare a new copy from current authorized terms
  /transaction-documents/readiness:
    get:
      operationId: getTransactionDocumentReadiness
      parameters:
        - name: leadId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Jurisdiction-specific persisted template registry plus private-storage and signing-provider readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionDocumentReadinessResponse" }
  /deals/{id}/contract/execution:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: executeContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContractExecutionInput" }
      responses:
        "200":
          description: Recorded external signatures; system does not sign documents
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/contract/milestones:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordClosingMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClosingMilestoneInput" }
      responses:
        "200":
          description: Recorded verified closing evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /deals/{id}/contract/outcome:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: recordDealOutcome
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DealOutcomeInput" }
      responses:
        "200":
          description: Settlement or externally evidenced cancellation, preserving history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DealOperations" }
  /buyers/{id}/qualification:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: requestBuyerQualification
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerQualificationRequest" }
      responses:
        "200":
          description: Explicit additional-evidence request, queued native handoff; not buyer approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /handoffs:
    get:
      operationId: listHandoffs
      responses:
        "200":
          description: Durable prepared outreach and actual human-reported events, never automatic sent claims
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/HumanHandoff" } }
  /handoffs/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: recordHandoffEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HandoffEventInput" }
      responses:
        "200":
          description: Actual contact or reply recorded; no qualification or commercial approval implied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HumanHandoff" }
  /workers:
    get:
      operationId: listWorkerJobs
      responses:
        "200":
          description: Durable matching and deadline worker executions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkerJob" } }
    post:
      operationId: submitWorkerJob
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkerJobInput" }
      responses:
        "201":
          description: Queued work
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkerJob" }
  /property-sources:
    # Source coverage remains explicit; no source is silently treated as nationwide.
    get:
      operationId: listPropertySources
      responses:
        "200":
          description: Explicitly supported public source coverage and limits
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PropertySource" } }
  /property-source-coverage:
    get:
      operationId: getPropertySourceCoverage
      responses:
        "200":
          description: Registered adapters and explicitly unconnected source capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertySourceCoverageResponse" }
  /property-sources/phila-opa/records:
    get:
      operationId: searchPublicProperties
      parameters:
        - { name: zip, in: query, schema: { type: string, pattern: '^191\d{2}$' } }
        - { name: lane, in: query, schema: { type: string, enum: [properties, buyer_candidates] } }
      responses:
        "200":
          description: Real source records, not listings or approved buyers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPropertySearch" }
  /property-sources/phila-opa/records/{recordId}/import:
    post:
      deprecated: true
      operationId: importPublicProperty
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, pattern: '^\d{9}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceReviewInput" }
      responses:
        "409":
          description: Direct discovery-to-lead promotion is disabled; use qualification first
  /property-discoveries:
    get:
      operationId: listPropertyDiscoveries
      parameters:
        - { name: marketKey, in: query, schema: { type: string, default: PHILADELPHIA_PA } }
        - { name: status, in: query, schema: { type: string, enum: [DISCOVERED_PROPERTY, RELEVANT_CANDIDATE, QUALIFIED_LEAD, CALL_READY, DISQUALIFIED] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: cursor, in: query, schema: { type: string, maxLength: 512 }, description: "Opaque cursor for the next stable relevance-ranked discovery page." }
        - { name: unmatchedCursor, in: query, schema: { type: string, maxLength: 512 }, description: "Opaque cursor for the next stable unmatched-source-observation page." }
      responses:
        "200":
          description: Raw source observations and explainable relevance qualification; only promoted records are active leads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDiscoveryList" }
  /property-discoveries/phila-opa/{recordId}:
    post:
      operationId: recordPublicPropertyDiscovery
      parameters:
        - { name: recordId, in: path, required: true, schema: { type: string, pattern: '^\d{9}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceReviewInput" }
      responses:
        "200":
          description: Upserted raw property/source observation and weak, provenance-backed relevance signals; does not create a lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDiscovery" }
  /property-discovery-criteria/{marketKey}:
    get:
      operationId: getPropertyDiscoveryCriteria
      parameters:
        - { name: marketKey, in: path, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      responses:
        "200":
          description: Versioned, market-specific qualification thresholds and signal weights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyQualificationCriteria" }
    put:
      operationId: savePropertyDiscoveryCriteria
      parameters:
        - { name: marketKey, in: path, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyQualificationCriteriaInput" }
      responses:
        "200":
          description: Saved, versioned market-specific qualification configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyQualificationCriteria" }
  /property-discoveries/{id}/signals:
    post:
      operationId: addPropertyRelevanceSignal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyRelevanceSignalInput" }
      responses:
        "200":
          description: Evidence-backed signal saved and relevance recomputed; AI hypotheses never count toward qualification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDiscovery" }
  /property-discoveries/{id}/promote:
    post:
      operationId: promotePropertyDiscovery
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyDiscoveryPromotionInput" }
      responses:
        "201":
          description: Qualified discovery linked to an active seller-side lead; no call readiness or contact authority is inferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDiscoveryPromotionResponse" }
  /property-discoveries/{id}/disqualify:
    post:
      operationId: disqualifyPropertyDiscovery
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PropertyDiscoveryDispositionInput" }
      responses:
        "200":
          description: Discovery intentionally excluded with an attributed reason; raw source observations are preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PropertyDiscovery" }
  /leads/{id}/source-research:
    get:
      operationId: getSourceResearch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Persisted source research; null when not yet collected
          content:
            application/json:
              schema:
                type: object
                required: [research]
                properties:
                  research: { oneOf: [{ $ref: "#/components/schemas/SourceResearch" }, { type: "null" }] }
    post:
      operationId: refreshSourceResearch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceRefreshInput" }
      responses:
        "200":
          description: Current property record and candidate sales without changing approved inputs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceResearch" }
  /leads/{id}/source-research/comps:
    post:
      operationId: addSourceComps
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceCompsInput" }
      responses:
        "200":
          description: Source candidates added to underwriting as unverified, condition unknown
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeadDetail" }
  /buyers/discovered:
    post:
      operationId: discoverBuyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerProspectInput" }
      responses:
        "201":
          description: Unverified prospect without invented criteria, funding or current intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /worker-capabilities:
    get:
      operationId: getWorkerCapabilities
      responses:
        "200":
          description: Registered execution ports and explicit unavailable integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, capability, state, reason, nextAction]
                  properties:
                    id: { type: string }
                    capability: { type: string }
                    state: { type: string, enum: [AVAILABLE, PENDING_CONNECTION] }
                    reason: { type: string }
                    nextAction: { type: string }
components:
  schemas:
    UnconnectedPropertySourceCapability:
      type: object
      required: [id, name, category, coverage, status, reason, nextAction]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        coverage: { type: string }
        status: { type: string, enum: [NOT_CONNECTED] }
        reason: { type: string }
        nextAction: { type: string }
    PropertySourceCoverageResponse:
      type: object
      required: [registeredSources, notConnectedProviders]
      properties:
        registeredSources: { type: array, items: { $ref: "#/components/schemas/PropertySource" } }
        notConnectedProviders: { type: array, items: { $ref: "#/components/schemas/UnconnectedPropertySourceCapability" } }
    PropertySource:
      type: object
      required: [id, name, coverage, termsUrl, capabilities, limitations]
      properties:
        id: { type: string }
        name: { type: string }
        coverage: { type: string }
        termsUrl: { type: string }
        capabilities: { type: array, items: { type: string } }
        limitations: { type: array, items: { type: string } }
    PropertySignalKey:
      type: string
      enum: [ENTITY_OWNER, LONG_TERM_HOLD, REPORTED_POOR_CONDITION, OPEN_CODE_VIOLATION, UNSAFE_BUILDING_RECORD, SELLER_MOTIVATION, TAX_DELINQUENCY, FORECLOSURE, PROBATE, ABSENTEE_OWNER, STALE_LISTING, REPEATED_PRICE_REDUCTION, BELOW_MARKET, VACANCY, EQUITY_OPPORTUNITY, MARKET_FIT]
    PropertySignalGroup:
      type: string
      enum: [OWNERSHIP_CONTEXT, CONDITION, MOTIVATION, DISTRESS, LISTING_PRESSURE, VACANCY, FINANCIAL_OPPORTUNITY, MARKET_FIT]
    PropertyEvidenceClassification:
      type: string
      enum: [VERIFIED, OBSERVED, INDICATED, AI_HYPOTHESIS]
    PropertyEvidenceSourceType:
      type: string
      enum: [PUBLIC_RECORD, PERMITTED_LISTING, SELLER, INSPECTION, PUBLIC_PAGE, ANALYST, MODEL]
    PropertyDiscoveryStatus:
      type: string
      enum: [DISCOVERED_PROPERTY, RELEVANT_CANDIDATE, QUALIFIED_LEAD, CALL_READY, DISQUALIFIED]
    PropertyRelevanceSignal:
      type: object
      required: [id, key, group, classification, sourceType, statement, source, sourceUrl, evidenceRef, capturedAt, confidence, scoreContribution]
      properties:
        id: { type: string }
        key: { $ref: "#/components/schemas/PropertySignalKey" }
        group: { $ref: "#/components/schemas/PropertySignalGroup" }
        classification: { $ref: "#/components/schemas/PropertyEvidenceClassification" }
        sourceType: { $ref: "#/components/schemas/PropertyEvidenceSourceType" }
        statement: { type: string }
        source: { type: string }
        sourceUrl: { type: ["string", "null"] }
        evidenceRef: { type: ["string", "null"] }
        capturedAt: { type: string, format: date-time }
        confidence: { type: number, minimum: 0, maximum: 1 }
        scoreContribution: { type: integer, minimum: 0, maximum: 100 }
    PropertySourceObservation:
      type: object
      required: [id, sourceKey, sourceId, sourceName, sourceUrl, firstObservedAt, lastObservedAt, seenCount, state, recordCount, recordIdentities, latestSourceEventAt, classification, confidence, evidenceRef, history]
      properties:
        id: { type: string, format: uuid }
        sourceKey: { type: string }
        sourceId: { type: string }
        sourceName: { type: string }
        sourceUrl: { type: string, format: uri }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
        seenCount: { type: integer, minimum: 1 }
        state: { type: string }
        recordCount: { type: integer, minimum: 0 }
        recordIdentities: { type: array, items: { type: string } }
        latestSourceEventAt: { type: ["string", "null"], format: date-time }
        classification:
          anyOf:
            - { $ref: "#/components/schemas/PropertyEvidenceClassification" }
            - { type: "null" }
        confidence: { type: ["number", "null"], minimum: 0, maximum: 1 }
        evidenceRef: { type: ["string", "null"] }
        history: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/PropertySourceObservationHistory" } }
    PropertySourceObservationHistory:
      type: object
      required: [observedAt, state, recordCount, recordIdentities, latestSourceEventAt, classification, confidence, evidenceRef]
      properties:
        observedAt: { type: string, format: date-time }
        state: { type: string }
        recordCount: { type: integer, minimum: 0 }
        recordIdentities: { type: array, items: { type: string } }
        latestSourceEventAt: { type: ["string", "null"], format: date-time }
        classification:
          anyOf:
            - { type: string, enum: [VERIFIED, OBSERVED, INDICATED, AI_HYPOTHESIS] }
            - { type: "null" }
        confidence: { type: ["number", "null"], minimum: 0, maximum: 1 }
        evidenceRef: { type: ["string", "null"] }
    UnmatchedPropertySourceObservation:
      type: object
      required: [id, marketKey, propertyId, sourceKey, sourceId, sourceName, sourceUrl, status, firstObservedAt, lastObservedAt, seenCount, state, recordCount, recordIdentities, latestSourceEventAt, classification, confidence, evidenceRef, history, nextAction]
      properties:
        id: { type: string, format: uuid }
        marketKey: { type: string }
        propertyId: { type: string, pattern: '^\d{9}$' }
        sourceKey: { type: string }
        sourceId: { type: string }
        sourceName: { type: string }
        sourceUrl: { type: string, format: uri }
        status: { type: string, enum: [UNMATCHED] }
        firstObservedAt: { type: string, format: date-time }
        lastObservedAt: { type: string, format: date-time }
        seenCount: { type: integer, minimum: 1 }
        state: { type: string }
        recordCount: { type: integer, minimum: 0 }
        recordIdentities: { type: array, items: { type: string } }
        latestSourceEventAt: { type: ["string", "null"], format: date-time }
        classification:
          anyOf:
            - { $ref: "#/components/schemas/PropertyEvidenceClassification" }
            - { type: "null" }
        confidence: { type: ["number", "null"], minimum: 0, maximum: 1 }
        evidenceRef: { type: ["string", "null"] }
        history: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/PropertySourceObservationHistory" } }
        nextAction: { type: string }
    LeadPropertyQualification:
      type: object
      required: [discoveryId, status, score, confidence, criteriaVersion, reviewReason, qualifiedBy, qualifiedAt, reason, signals, missingInformation, nextAction]
      properties:
        discoveryId: { type: string }
        status: { type: string, enum: [QUALIFIED_LEAD, CALL_READY, DISQUALIFIED] }
        score: { type: integer, minimum: 0, maximum: 100 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        criteriaVersion: { type: integer, minimum: 1 }
        reviewReason: { type: string }
        qualifiedBy: { type: string }
        qualifiedAt: { type: string, format: date-time }
        reason: { type: string }
        signals: { type: array, items: { $ref: "#/components/schemas/PropertyRelevanceSignal" } }
        missingInformation: { type: array, items: { type: string } }
        nextAction: { type: string }
    PropertySignalRule:
      type: object
      required: [key, points, enabled]
      properties:
        key: { $ref: "#/components/schemas/PropertySignalKey" }
        points: { type: integer, minimum: 0, maximum: 100 }
        enabled: { type: boolean }
    PropertyQualificationCriteriaInput:
      type: object
      required: [candidateThreshold, qualifiedLeadThreshold, minimumIndependentSignalGroups, requiredLeadGroupAnyOf, longHoldYears, signalRules]
      properties:
        candidateThreshold: { type: integer, minimum: 1, maximum: 100 }
        qualifiedLeadThreshold: { type: integer, minimum: 1, maximum: 100 }
        minimumIndependentSignalGroups: { type: integer, minimum: 2, maximum: 8 }
        requiredLeadGroupAnyOf: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/PropertySignalGroup" } }
        longHoldYears: { type: integer, minimum: 1, maximum: 100 }
        signalRules: { type: array, minItems: 1, maxItems: 16, items: { $ref: "#/components/schemas/PropertySignalRule" } }
    PropertyQualificationCriteria:
      allOf:
        - { $ref: "#/components/schemas/PropertyQualificationCriteriaInput" }
        - type: object
          required: [marketKey, version]
          properties:
            marketKey: { type: string }
            version: { type: integer, minimum: 1 }
    BuyerDemandEvidence:
      type: object
      required: [buyerId, buyerVersion, criteriaEvidenceAt, buyingEvidenceAt, identityVerifiedAt, validUntil, reviewerConfidence, reason]
      properties:
        buyerId: { type: string, format: uuid }
        buyerVersion: { type: integer, minimum: 1 }
        criteriaEvidenceAt: { type: string, format: date-time }
        buyingEvidenceAt: { type: string, format: date-time }
        identityVerifiedAt: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
        reviewerConfidence: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
    BuyerDemandFit:
      type: object
      required: [status, alignedBuyerCount, currentQualifiedBuyerCount, unqualifiedBuyerCount, excludedForKnownCriteriaMismatch, priorityBonus, reason, missingInformation, evidence, snapshotComputedAt, snapshotFresh]
      properties:
        status: { type: string, enum: [ALIGNED_ON_KNOWN_FIELDS, NO_VERIFIED_DEMAND] }
        alignedBuyerCount: { type: integer, minimum: 0 }
        currentQualifiedBuyerCount: { type: integer, minimum: 0 }
        unqualifiedBuyerCount: { type: integer, minimum: 0 }
        excludedForKnownCriteriaMismatch: { type: integer, minimum: 0 }
        priorityBonus: { type: integer, minimum: 0, maximum: 15 }
        reason: { type: string }
        missingInformation: { type: array, items: { type: string } }
        evidence: { type: array, items: { $ref: "#/components/schemas/BuyerDemandEvidence" } }
        snapshotComputedAt: { type: ["string", "null"], format: date-time }
        snapshotFresh: { type: boolean }
    PropertyDiscovery:
      type: object
      required: [id, marketKey, status, score, priorityScore, confidence, version, property, signals, sourceObservations, reason, rankingReasons, missingInformation, nextAction, demandFit, sourceObservationCount, relatedOwnerPropertyCount, leadId, criteriaVersion, canPromote, promotionBlockers, firstObservedAt, lastObservedAt]
      properties:
        id: { type: string, format: uuid }
        marketKey: { type: string }
        status: { $ref: "#/components/schemas/PropertyDiscoveryStatus" }
        score: { type: integer, minimum: 0, maximum: 100 }
        priorityScore: { type: integer, minimum: 0, maximum: 120 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        version: { type: integer, minimum: 1 }
        property: { $ref: "#/components/schemas/PublicProperty" }
        signals: { type: array, items: { $ref: "#/components/schemas/PropertyRelevanceSignal" } }
        sourceObservations: { type: array, items: { $ref: "#/components/schemas/PropertySourceObservation" } }
